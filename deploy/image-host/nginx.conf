server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* "^/[0-9a-f]{32}\.(jpg|jpeg|png|gif|webp)$" {
        try_files $uri =404;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        return 404;
    }
}
